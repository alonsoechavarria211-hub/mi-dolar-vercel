<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dólar Colombia - Comparativo Interanual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e6e9ef;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 860px;
      background: #161922;
      border: 1px solid #262b38;
      border-radius: 12px;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }
    .spot-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .spot {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .up { color: #16a34a; }
    .down { color: #dc2626; }
    .yoy-badge {
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .meta { font-size: 12px; color: #9aa3b2; }

    /* Botones de Selección de Período */
    .controls {
      display: flex;
      background: #0f1117;
      border: 1px solid #262b38;
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }
    .btn {
      background: transparent;
      border: none;
      color: #9aa3b2;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { color: #ffffff; background: #1e2330; }
    .btn.active { background: #2563eb; color: #ffffff; }

    .chart-wrap {
      position: relative;
      height: 400px;
      width: 100%;
    }
    .legend-row {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 12px;
      color: #9aa3b2;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot-current { width: 10px; height: 10px; background: #16a34a; border-radius: 50%; }
    .dot-prev { width: 10px; height: 2px; background: #64748b; border-style: dashed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="spot-wrap">
        <span id="spotPrice" class="spot">Cargando...</span>
        <div id="yoyBadge" class="yoy-badge">--</div>
        <div class="meta" id="lineaBaseText">Línea base: --</div>
      </div>

      <div class="controls">
        <button class="btn" onclick="setRange('1D')">Hora / Día</button>
        <button class="btn" onclick="setRange('1W')">Semana</button>
        <button class="btn active" id="btn-1M" onclick="setRange('1M')">Mes</button>
        <button class="btn" onclick="setRange('1Y')">Año</button>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="fxChart"></canvas>
    </div>

    <div class="legend-row">
      <div class="legend-item"><div class="dot-current"></div> Período Actual</div>
      <div class="legend-item"><div class="dot-prev"></div> Mismo período año anterior (YoY)</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    let currentRange = '1M';
    let chartInstance = null;

    const fmt = (n) =>
      Number(n).toLocaleString('es-CO', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

    async function loadData(range) {
      currentRange = range;
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      event?.target?.classList.add('active');

      try {
        const res = await fetch(`/api/usd-cop?range=${range}`);
        const data = await res.json();

        const spotEl = document.getElementById('spotPrice');
        spotEl.textContent = `$ ${fmt(data.currentSpot)}`;
        spotEl.className = `spot ${data.currentSpot >= data.threshold ? 'up' : 'down'}`;

        const yoyEl = document.getElementById('yoyBadge');
        const isUp = data.yoyDiff >= 0;
        yoyEl.className = `yoy-badge ${isUp ? 'up' : 'down'}`;
        yoyEl.textContent = `vs Año Anterior: ${isUp ? '+' : ''}${fmt(data.yoyDiff)} COP (${isUp ? '+' : ''}${data.yoyPct}%)`;

        document.getElementById('lineaBaseText').textContent = `Línea base (Inicio período): $ ${fmt(data.threshold)}`;

        const labels = data.pointsCurrent.map(p => p.t);
        const valuesCurrent = data.pointsCurrent.map(p => p.v);
        const valuesYoY = data.pointsYoY.map(p => p.v);

        renderChart(labels, valuesCurrent, valuesYoY, data.threshold);
      } catch (err) {
        console.error('Error cargando datos:', err);
      }
    }

    function renderChart(labels, currentData, yoyData, threshold) {
      const ctx = document.getElementById('fxChart').getContext('2d');

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Período Actual',
              data: currentData,
              borderColor: currentData[currentData.length - 1] >= threshold ? '#16a34a' : '#dc2626',
              borderWidth: 2.5,
              pointRadius: 0,
              tension: 0.1
            },
            {
              label: 'Año Anterior',
              data: yoyData,
              borderColor: '#64748b',
              borderWidth: 1.5,
              borderDash: [5, 5],
              pointRadius: 0,
              tension: 0.1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(148, 163, 184, 0.08)' }, ticks: { color: '#9aa3b2' } },
            y: { grid: { color: 'rgba(148, 163, 184, 0.08)' }, ticks: { color: '#9aa3b2', callback: (v) => fmt(v) } }
          }
        }
      });
    }

    function setRange(range) {
      loadData(range);
    }

    loadData('1M');
  </script>
</body>
</html>
