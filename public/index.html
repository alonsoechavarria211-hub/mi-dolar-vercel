<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dólar Colombia - Tablero Interactivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e6e9ef;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 880px;
      background: #161922;
      border: 1px solid #262b38;
      border-radius: 12px;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }
    .spot-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .spot {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .up { color: #16a34a; }
    .down { color: #dc2626; }
    .yoy-badge {
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .meta { font-size: 12px; color: #9aa3b2; }

    .controls {
      display: flex;
      background: #0f1117;
      border: 1px solid #262b38;
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }
    .btn {
      background: transparent;
      border: none;
      color: #9aa3b2;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover { color: #ffffff; background: #1e2330; }
    .btn.active { background: #2563eb; color: #ffffff; }

    .chart-wrap {
      position: relative;
      height: 400px;
      width: 100%;
    }
    .legend-row {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      font-size: 12px;
      color: #9aa3b2;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .dot-current { width: 12px; height: 3px; background: #16a34a; border-radius: 2px; }
    .dot-prev { width: 12px; height: 3px; background: #94a3b8; border-radius: 2px; border-top: 1px dashed #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="spot-wrap">
        <span id="spotPrice" class="spot">Cargando...</span>
        <div id="yoyBadge" class="yoy-badge">--</div>
        <div class="meta" id="lineaBaseText">Línea base: --</div>
      </div>

      <div class="controls">
        <button class="btn" onclick="setRange('1D', this)">Hora / Día</button>
        <button class="btn" onclick="setRange('1W', this)">Semana</button>
        <button class="btn active" onclick="setRange('1M', this)">Mes</button>
        <button class="btn" onclick="setRange('1Y', this)">Año</button>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="fxChart"></canvas>
    </div>

    <div class="legend-row">
      <div class="legend-item"><div class="dot-current"></div> Período Actual (2026)</div>
      <div class="legend-item"><div class="dot-prev"></div> Año Anterior (2025)</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    let currentRange = '1M';
    let chartInstance = null;
    let fullDates = [];

    const fmt = (n) =>
      Number(n).toLocaleString('es-CO', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

    async function loadData(range) {
      currentRange = range;
      try {
        const res = await fetch(`/api/usd-cop?range=${range}`);
        const data = await res.json();

        const spotEl = document.getElementById('spotPrice');
        spotEl.textContent = `$ ${fmt(data.currentSpot)}`;
        spotEl.className = `spot ${data.currentSpot >= data.threshold ? 'up' : 'down'}`;

        const yoyEl = document.getElementById('yoyBadge');
        const isUp = data.yoyDiff >= 0;
        yoyEl.className = `yoy-badge ${isUp ? 'up' : 'down'}`;
        yoyEl.textContent = `vs Año Anterior: ${isUp ? '+' : ''}${fmt(data.yoyDiff)} COP (${isUp ? '+' : ''}${data.yoyPct}%)`;

        document.getElementById('lineaBaseText').textContent = `Línea base (Inicio período): $ ${fmt(data.threshold)}`;

        fullDates = data.pointsCurrent.map(p => p.fullDate);
        const labels = data.pointsCurrent.map(p => p.t);
        const valuesCurrent = data.pointsCurrent.map(p => p.v);
        const valuesYoY = data.pointsYoY.map(p => p.v);

        renderChart(labels, valuesCurrent, valuesYoY, data.threshold, range);
      } catch (err) {
        console.error('Error cargando datos:', err);
      }
    }

    function renderChart(labels, currentData, yoyData, threshold, range) {
      const ctx = document.getElementById('fxChart').getContext('2d');

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Año 2026',
              data: currentData,
              borderColor: currentData[currentData.length - 1] >= threshold ? '#16a34a' : '#dc2626',
              borderWidth: 2.5,
              pointRadius: range === '1Y' ? 0 : 2,
              pointHoverRadius: 6,
              tension: 0.1
            },
            {
              label: 'Año 2025',
              data: yoyData,
              borderColor: '#94a3b8',
              borderWidth: 1.8,
              borderDash: [5, 5],
              pointRadius: 0,
              pointHoverRadius: 6,
              tension: 0.1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1e2330',
              titleColor: '#e6e9ef',
              bodyColor: '#cbd5e1',
              borderColor: '#334155',
              borderWidth: 1,
              padding: 12,
              displayColors: true,
              callbacks: {
                title: function(context) {
                  const idx = context[0].dataIndex;
                  return fullDates[idx] || context[0].label;
                },
                label: function(context) {
                  return `${context.dataset.label}: $ ${fmt(context.parsed.y)}`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(148, 163, 184, 0.08)' },
              ticks: {
                color: '#9aa3b2',
                maxRotation: range === '1Y' ? 0 : 45,
                autoSkip: true,
                maxTicksLimit: range === '1Y' ? 12 : 15
              }
            },
            y: {
              grid: { color: 'rgba(148, 163, 184, 0.08)' },
              ticks: { color: '#9aa3b2', callback: (v) => fmt(v) }
            }
          }
        }
      });
    }

    function setRange(range, btnElement) {
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      loadData(range);
    }

    loadData('1M');
  </script>
</body>
</html>
